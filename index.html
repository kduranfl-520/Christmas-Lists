}

@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.panel h2 { font-family: var(--font-d); font-weight: 750; font-size: 1.4rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.f { display: flex; flex-direction: column; gap: 6px; }
.f > span, .lab { font-size: 0.82rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
input, textarea { font: inherit; font-size: 16px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
textarea { min-height: 72px; resize: vertical; }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sopt { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 600; text-align: left; }
.sopt .ic { color: var(--c); flex: none; }
.sopt[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.acts { display: flex; flex-direction: column; gap: 8px; }
.btn { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-weight: 650; padding: 0 16px; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.dng { color: var(--danger); }
.btn.dng.armed { background: var(--danger); color: var(--bg); border-color: var(--danger); }
.err { margin: 0; color: var(--danger); font-size: 0.9rem; font-weight: 600; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 14px; font-weight: 600; font-size: 0.92rem; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 700; padding: 6px; }
.skel { height: 64px; border-radius: 14px; background: var(--surface2); margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
</style>
</head>

<div id="glow" aria-hidden="true"></div>

      '<div class="acts"><button class="btn pri" data-s="save">Save</button><button class="btn" data-s="cancel">Cancel</button>' + (o.remove ? '<button class="btn dng" data-s="del">' + esc(o.removeLabel) + '</button>' : '') + '</div>', '#nm');
    H = {
      save: function () { var v = $('#nm').value.trim(); if (!v) return showErr('Enter a name.'); var bd = $('#bd'), bv = bd ? Math.max(0, parseFloat(bd.value) || 0) : 0; closeSheet(); o.save(v, pic, bv); },
      pic: function (b) { pic = b.dataset.k; sheetEl.querySelectorAll('[data-s="pic"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.k === pic)); }); },
      cancel: closeSheet,
      del: function (b) {
        if (!armed) { armed = true; b.textContent = o.removeWarn; b.classList.add('armed'); return; }
        closeSheet(); o.remove();
      }
    };
  }
  function giftSheet(g, pid) {
    var p = perOf(pid), cur = { status: g.status, stocking: !!g.stocking, tomake: !!g.tomake }, armed = false;
    var grid = PROGRESS.map(function (s) {
      return '<button type="button" class="sopt" style="--c:' + cvar(s.k) + '" data-s="st" data-k="' + s.k + '" aria-pressed="' + (cur.status === s.k) + '">' + ico(s.k, 20) + esc(s.label) + '</button>';
    }).join('');
    var flags = ST.filter(function (s) { return s.flag; }).map(function (s) {
      return '<button type="button" class="sopt" style="--c:' + cvar(s.k) + '" data-s="flag" data-k="' + s.k + '" aria-pressed="' + cur[s.k] + '">' + ico(s.k, 20) + esc(s.label) + '</button>';
    }).join('');
    openSheet('<h2>' + (g.isNew ? 'New gift for ' : 'Gift for ') + esc(p ? p.name : '') + '</h2>' +
      '<label class="f"><span>Gift</span><input id="gname" value="' + esc(g.name || '') + '" placeholder="Fuzzy slippers" maxlength="100" autocomplete="off"></label>' +
      '<div><div class="lab" style="margin-bottom:6px">Progress</div><div class="sgrid">' + grid + '</div></div>' +
      '<div><div class="lab" style="margin-bottom:6px">Also mark as</div><div class="sgrid">' + flags + '</div></div>' +
      '<label class="f"><span>Price</span><input id="gprice" inputmode="decimal" value="' + esc(g.price || '') + '" placeholder="25" autocomplete="off"></label>' +
      '<label class="f"><span>Notes or link</span><textarea id="gnotes" placeholder="Size, color, store, order number">' + esc(g.notes || '') + '</textarea></label>' +
      '<p class="err" id="err" hidden></p>' +
      '<div class="acts"><button class="btn pri" data-s="save">Save gift</button><button class="btn" data-s="cancel">Cancel</button>' + (g.isNew ? '' : '<button class="btn dng" data-s="del">Delete gift</button>') + '</div>', g.isNew ? '#gname' : null);
    function sync() {
      sheetEl.querySelectorAll('[data-s="st"]').forEach(function (b) { b.setAttribute('aria-pressed', String(cur.status === b.dataset.k)); });
      sheetEl.querySelectorAll('[data-s="flag"]').forEach(function (b) { b.setAttribute('aria-pressed', String(!!cur[b.dataset.k])); });
    }
    H = {
      st: function (b) { cur.status = b.dataset.k; sync(); },
      flag: function (b) { cur[b.dataset.k] = !cur[b.dataset.k]; sync(); },
      save: function () {
        var name = $('#gname').value.trim();
        if (!name) return showErr('Enter what the gift is.');
        var pr = parseFloat(($('#gprice').value || '').replace(/[^0-9.]/g, ''));
        var o = { id: g.id, personId: g.personId, familyId: g.familyId, name: name, status: cur.status, stocking: cur.stocking, tomake: cur.tomake, price: isNaN(pr) ? null : pr, notes: $('#gnotes').value.trim(), created: g.created };
        closeSheet(); put('gifts', o);
      },
      cancel: closeSheet,
      del: function (b) {
        if (!armed) { armed = true; b.textContent = 'Tap again to delete'; b.classList.add('armed'); return; }
        closeSheet(); del('gifts', g.id); render();
      }
    };
  }

  function setYear(y) {
    S.year = y;
    if (DB) queue('settings', 'main', function () { return DB.collection('settings').doc('main').set({ year: y }); }); else saveLocal();
  }
  function yearSheet() {
    var y = christmas().year + 1, n = S.gifts.length, armed = false;
    openSheet('<h2>Start Christmas ' + y + '?</h2><p style="margin:0;color:var(--muted)">This clears all ' + plural(n, 'gift') + ' and keeps your families and people, so you can start fresh gift lists. It cannot be undone.</p>' +
      '<div class="acts"><button class="btn dng" data-s="go">Clear gifts and start ' + y + '</button><button class="btn" data-s="cancel">Cancel</button></div>');
    H = {
      cancel: closeSheet,
      go: function (b) {
        if (!armed) { armed = true; b.textContent = 'Tap again to clear ' + plural(n, 'gift'); b.classList.add('armed'); return; }
        closeSheet(); autoSnap(snapData(), true);
        S.gifts.slice().forEach(function (g) { del('gifts', g.id); });
        setYear(y); S.pf = 'all'; render(); window.scrollTo(0, 0);
        toast('Ready for Christmas ' + y);
      }
    };
  }


  /* ---------- party / RSVP ---------- */
  var guestOf = function (id) { return S.guests.find(function (g) { return g.id === id; }); };
  var isSent = function (g) { return g.sent === undefined ? (g.rsvp === 'yes' || g.rsvp === 'no') : !!g.sent; };
  function party() {
    var gs = S.guests, yes = gs.filter(function (g) { return g.rsvp === 'yes'; }), no = gs.filter(function (g) { return g.rsvp === 'no'; }),
      wait = gs.filter(function (g) { return isSent(g) && g.rsvp !== 'yes' && g.rsvp !== 'no'; }).length, unsent = gs.filter(function (g) { return !isSent(g) && g.rsvp !== 'yes' && g.rsvp !== 'no'; }).length, heads = yes.reduce(function (a, g) { return a + (+g.heads || 1); }, 0);
    var rows = gs.map(function (g) {
      var h = +g.heads || 1, sent = isSent(g), id = esc(g.id);
      return '<div class="guest"><div class="titlerow"><div><b>' + esc(g.name) + '</b></div>' +
        '<button class="editbtn" data-act="edit-guest" data-id="' + id + '">Edit</button></div>' +
        '<input class="bring" data-bring="' + id + '" value="' + esc(g.bring || '') + '" placeholder="Bringing (food, drinks...)" maxlength="80" autocomplete="off" aria-label="What ' + esc(g.name) + ' is bringing">' +
        '<div class="rsvp"><button class="rbtn sent" aria-pressed="' + sent + '" data-act="sent" data-id="' + id + '">' + (sent ? '✓ Invite sent' : 'Mark invite sent') + '</button>' +
        (sent ? '<button class="rbtn yes" aria-pressed="' + (g.rsvp === 'yes') + '" data-act="rsvp" data-v="yes" data-id="' + id + '">Yes</button>' +
          '<button class="rbtn no" aria-pressed="' + (g.rsvp === 'no') + '" data-act="rsvp" data-v="no" data-id="' + id + '">No</button>' : '') +
        '<span class="step"><button aria-label="One fewer" data-act="heads" data-d="-1" data-id="' + id + '">−</button><span>' + h + '<small>' + (h === 1 ? 'person' : 'people') + '</small></span><button aria-label="One more" data-act="heads" data-d="1" data-id="' + id + '">+</button></span></div></div>';
    }).join('');
    return '<div class="frozen"><header class="top">' + crumb('Christmas', 'home') + '<div class="titlerow"><div><div class="eyebrow">Party</div><h1>Christmas Party</h1></div></div></header>' +
      '<div class="sum"><p>' + gs.filter(isSent).length + ' of ' + gs.length + ' invites sent</p><p>' + heads + (heads === 1 ? ' person' : ' people') + ' coming · ' + yes.length + ' yes · ' + no.length + ' no · ' + wait + ' waiting</p></div></div>' +
      foodSection(gs) + '<h2 class="sec">Guests</h2>' +
      (gs.length ? '<div class="list">' + rows + '</div>' : '<div class="empty"><b>No guests yet</b><p>Add each person or family you invite. Mark Yes or No as they reply and set how many are coming.</p></div>') +
      '<button class="fab" data-act="new-guest">+ Add guest</button>';
  }
  function foodSection(gs) {
    var items = S.food.map(function (f) { return '<div class="fitem"><span>' + esc(f.text) + '</span><button aria-label="Remove ' + esc(f.text) + '" data-act="del-food" data-id="' + esc(f.id) + '">×</button></div>'; }).join('');
    var br = gs.filter(function (g) { return (g.bring || '').trim(); }).map(function (g) { return esc(g.name) + ': ' + esc(g.bring.trim()); }).join(' · ');
    return '<h2 class="sec">Food ideas</h2><div class="food">' + (items || '<span class="bringing">No ideas yet. Add dishes, drinks or desserts.</span>') +
      '<div class="faddrow"><input id="fi" placeholder="Add a food idea" maxlength="80" autocomplete="off"><button class="btn pri" style="min-height:42px" data-act="add-food">Add</button></div>' +
      (br ? '<p class="bringing"><b>Bringing:</b> ' + br + '</p>' : '') + '</div>';
  }
  function guestSheet(g) {
    var armed = false, hc = +g.heads || 1;
    openSheet('<h2>' + (g.isNew ? 'Add guest' : 'Edit guest') + '</h2>' +
      '<label class="f"><span>Name or family</span><input id="gn" value="' + esc(g.name || '') + '" placeholder="The Smiths" maxlength="60" autocomplete="off"></label>' +
      '<div class="f"><span>Number of people</span><div class="bigstep"><button type="button" data-s="hm" aria-label="One fewer">−</button><b id="ghv">' + (+g.heads || 1) + '</b><button type="button" data-s="hp" aria-label="One more">+</button></div></div>' +
      '<p class="err" id="err" hidden></p>' +
      '<div class="acts"><button class="btn pri" data-s="save">Save</button><button class="btn" data-s="cancel">Cancel</button>' + (g.isNew ? '' : '<button class="btn dng" data-s="del">Remove guest</button>') + '</div>', '#gn');
    H = {
      cancel: closeSheet,
      hm: function () { hc = Math.max(1, hc - 1); $('#ghv').textContent = hc; },
      hp: function () { hc = Math.min(50, hc + 1); $('#ghv').textContent = hc; },
      save: function () {
        var n = $('#gn').value.trim(); if (!n) return showErr('Enter a name.');
        var h = hc; closeSheet();
        var o = Object.assign({}, g, { name: n, heads: h, rsvp: g.rsvp || 'wait' }); delete o.isNew; put('guests', o);
      },
      del: function (b) {
        if (!armed) { armed = true; b.textContent = 'Tap again to remove'; b.classList.add('armed'); return; }
        closeSheet(); del('guests', g.id); render();
      }
    };
  }

  /* ---------- toast ---------- */
  var tt;
  function toast(msg, undo) {
    toastEl.innerHTML = '<span></span>' + (undo ? '<button type="button">Undo</button>' : '');
    toastEl.firstChild.textContent = msg;
    if (undo) toastEl.querySelector('button').onclick = function () { toastEl.hidden = true; undo(); };
    toastEl.hidden = false; clearTimeout(tt);
    tt = setTimeout(function () { toastEl.hidden = true; }, 4500);
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.dataset.act, id = el.dataset.id, v = S.view;
    if (a === 'go') return go(el.dataset.to);
    if (a === 'pf') { S.pf = el.dataset.k; return render(); }
    if (a === 'new-year') return yearSheet();
    if (a === 'backup') return backupSheet();
    if (a === 'add-food') { var fi = $('#fi'), tx = fi && fi.value.trim(); if (tx) { S.focusFood = true; put('food', { id: uid(), text: tx, created: Date.now() }); } return; }
    if (a === 'del-food') { del('food', id); return render(); }
    if (a === 'fcount') { var ff = famOf(id); if (ff) { var cc = Object.assign({}, ff.counts || {}), kk = el.dataset.k; cc[kk] = Math.min(99, Math.max(0, (+cc[kk] || 0) + (+el.dataset.d))); put('families', Object.assign({}, ff, { counts: cc })); } return; }
    if (a === 'new-guest') return guestSheet({ isNew: true, id: uid(), rsvp: 'wait', heads: 1, created: Date.now() });
    if (a === 'edit-guest') { var gg = guestOf(id); if (gg) guestSheet(gg); return; }
    if (a === 'sent') { var g5 = guestOf(id); if (g5) put('guests', Object.assign({}, g5, { sent: !isSent(g5) })); return; }
    if (a === 'rsvp') { var g3 = guestOf(id); if (g3) put('guests', Object.assign({}, g3, { rsvp: g3.rsvp === el.dataset.v ? 'wait' : el.dataset.v })); return; }
    if (a === 'heads') { var g4 = guestOf(id); if (g4) put('guests', Object.assign({}, g4, { heads: Math.min(50, Math.max(1, (+g4.heads || 1) + (+el.dataset.d))) })); return; }
    if (a === 'new-family') return nameSheet({ title: 'New family', label: 'Family name', ph: 'Mom’s side', pics: true, pic: nextPic(), save: function (n, pic) { put('families', { id: uid(), name: n, icon: pic || null, created: Date.now() }); } });
    if (a === 'new-person') return nameSheet({ title: 'Add person', label: 'Name', ph: 'Grandma Rose', budget: true, save: function (n, pic, bv) { put('people', { id: uid(), familyId: v.id, name: n, budget: bv || 0, created: Date.now() }); } });
    if (a === 'new-gift') {
      var p = perOf(v.id), st = (S.pf !== 'all' && !BYK[S.pf].flag) ? S.pf : 'ideas';
      return giftSheet({ isNew: true, id: uid(), personId: p.id, familyId: p.familyId, status: st, stocking: S.pf === 'stocking', tomake: S.pf === 'tomake', created: Date.now() }, p.id);
    }
    if (a === 'edit-gift') { var g = giftOf(id); if (g) giftSheet(g, g.personId); return; }
    if (a === 'advance') {
      var g2 = giftOf(id); if (!g2 || !NEXT[g2.status]) return;
      var prev = g2.status, nx = NEXT[prev];
      put('gifts', Object.assign({}, g2, { status: nx }));
      return toast(g2.name + ' → ' + BYK[nx].label, function () { var cur = giftOf(id); if (cur) put('gifts', Object.assign({}, cur, { status: prev })); });
    }
    if (a === 'edit-family') {
      var f = famOf(id), np = pOfF(id).length, ng = gOfF(id).length;
      return nameSheet({ title: 'Edit family', label: 'Family name', ph: 'Family name', value: f.name, pics: true, pic: f.icon, save: function (n, pic) { put('families', Object.assign({}, f, { name: n, icon: pic || null })); },
        removeLabel: 'Delete family', removeWarn: 'Tap again to delete ' + plural(np, 'person').replace('persons', 'people') + ' and ' + plural(ng, 'gift'), remove: function () { delFamily(id); go('home'); } });
    }
    if (a === 'edit-person') {
      var pp = perOf(id), n2 = gOfP(id).length;
      return nameSheet({ title: 'Edit person', label: 'Name', ph: 'Name', value: pp.name, budget: true, budgetVal: budgetOf(pp) || '', save: function (n, pic, bv) { put('people', Object.assign({}, pp, { name: n, budget: bv || 0 })); },
        removeLabel: 'Delete person', removeWarn: 'Tap again to delete ' + plural(n2, 'gift'), remove: function () { var fid = pp.familyId; delPerson(id); go('family:' + fid); } });
    }
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'fi') { e.preventDefault(); var b = app.querySelector('[data-act="add-food"]'); if (b) b.click(); }
  });
  app.addEventListener('change', function (e) {
    var id = e.target.dataset && e.target.dataset.bring; if (!id) return;
    var g = guestOf(id); if (g) put('guests', Object.assign({}, g, { bring: e.target.value.trim() }), true);
  });

  var rootEl = document.documentElement, ticking = false;
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; rootEl.classList.toggle('scrolled', (window.scrollY || 0) > 6); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  render();
  init();
})();
</script>
</body>
</html>
